name: Brewster
description: Brewster was a New York-based mobile contacts startup founded by Steve Greenwood that
  launched an iOS app in July 2012 offering a "hyperconnected mobile address book" — it merged phone
  contacts with Google Apps, Facebook, Twitter, Foursquare and LinkedIn profiles, deduplicated them,
  and kept them self-updating in the cloud while surfacing relationship signals about who a user
  actually engaged with. The company was backed by Union Square Ventures and Slow Ventures. In October
  2015 the founding team was acqui-hired by Restaurant Brands International (owner of Burger King and
  Tim Hortons) without the app or its data, and in March 2016 FullContact acquired Brewster's
  self-updating address book technology and shut the consumer product down within 30 days. Brewster
  never published a public developer API, SDK, OpenAPI definition or developer portal, and no API
  surface survives today. This profile is retained as a historical record only.
